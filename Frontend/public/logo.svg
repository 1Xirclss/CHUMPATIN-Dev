<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#050608"/>
      <stop offset="95%" stop-color="#12131C"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo circular negro con sutil borde neón -->
  <circle cx="250" cy="250" r="236" fill="url(#neonGlow)" stroke="#232738" stroke-width="8"/>
  <circle cx="250" cy="250" r="236" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Rayo de Fiesta XXL en la parte superior -->
  <path d="M255 75 L235 125 L252 125 L242 165 L268 115 L250 115 Z" fill="#00f2fe" filter="url(#glow)"/>

  <!-- Texto Central CHUMPATIN -->
  <text x="250" y="275" 
        text-anchor="middle" 
        fill="url(#textGrad)" 
        font-family="'Syne', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="62" 
        letter-spacing="4">
    CHUMPATIN
  </text>
  
  <text x="405" y="235" 
        text-anchor="middle" 
        fill="#94a3b8" 
        font-family="'Outfit', sans-serif" 
        font-weight="700" 
        font-size="20">
    ®
  </text>

  <!-- Subtítulo LAST DANCE 2026 -->
  <text x="250" y="325" 
        text-anchor="middle" 
        fill="#00f2fe" 
        font-family="'Outfit', sans-serif" 
        font-weight="800" 
        font-size="22" 
        letter-spacing="8" 
        opacity="0.95">
    LAST DANCE 2026
  </text>
</svg>
